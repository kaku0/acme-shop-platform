# Backstage catalog for this repository. Shared entries (groups, systems) are identical in every ACME Shop repo.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: platform
  title: Commerce Platform
  description: Shared commerce event bus, event archive and the real-time notification channel used by back-office screens.
  tags:
  - python
  - aws-lambda
  - eventbridge
  annotations:
    github.com/project-slug: kaku0/acme-shop-platform
    stackrails.io/hosts: events.internal.acme-shop.example
  links:
  - url: https://github.com/kaku0/acme-shop-platform
    title: Source
spec:
  type: service
  lifecycle: production
  owner: group:cloud-platform-team
  system: commerce-platform
  dependsOn:
  - component:ecom-lib
---
apiVersion: backstage.io/v1alpha1
